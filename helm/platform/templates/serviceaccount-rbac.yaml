apiVersion: v1
kind: ServiceAccount
metadata: {name: platform-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: platform-api}
spec: {minAvailable: 1, selector: {matchLabels: {app: platform-api}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-api}
spec:
  podSelector: {matchLabels: {app: platform-api}}
  policyTypes: [Ingress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: default}}}], ports: [{protocol: TCP, port: 8080}]}]

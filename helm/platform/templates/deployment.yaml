apiVersion: apps/v1
kind: Deployment
metadata: {name: platform-api, labels: {app: platform-api}}
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: platform-api}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: platform-api}}
    spec:
      serviceAccountName: platform-api
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports: [{containerPort: 8080}]
        resources: {{- toYaml .Values.resources | nindent 14 }}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 20, periodSeconds: 10}
        readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 10, periodSeconds: 5}
        env: [{name: APP_NAME, value: platform-api}]

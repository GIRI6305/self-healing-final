name: Self-Healing Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  production-health:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Backend health
        run: curl --fail --silent --show-error --retry 5 https://self-healing-final.onrender.com/actuator/health
      - name: Frontend health
        run: curl --fail --silent --show-error --retry 5 -I https://self-healing-final-866indtze-giri6305s-projects.vercel.app

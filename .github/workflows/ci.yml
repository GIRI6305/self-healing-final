name: CI
on: [push, pull_request]
permissions: {contents: read, security-events: write}
jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '21', cache: maven}
    - run: mvn -q -f backend/pom.xml test package
    - uses: gitleaks/gitleaks-action@v2
      continue-on-error: true
    - uses: aquasecurity/trivy-action@0.28.0
      with: {scan-type: fs, scan-ref: '.', severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: 'true'}
    - uses: anchore/sbom-action@v0.20.5
      with: {path: ., format: cyclonedx-json, output-file: sbom.cdx.json}
    - uses: actions/upload-artifact@v4
      with: {name: sbom, path: sbom.cdx.json}

groups:
- name: platform-sre
  rules:
  - alert: PlatformApiDown
    expr: up{job="platform-api"} == 0
    for: 30s
    labels: {severity: critical}
    annotations: {summary: "Platform API is unavailable"}
  - alert: HighErrorRate
    expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
    for: 2m
    labels: {severity: warning}
    annotations: {summary: "Platform API 5xx rate is elevated"}
